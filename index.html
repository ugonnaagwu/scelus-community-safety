<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B2B52">
<meta name="description" content="Scelus — Community safety, missing-person information, and support resources.">
<title>Scelus — Safe Today. Secure Tomorrow.</title>
<style>
:root{--navy:#0b2b52;--blue:#2468b6;--coral:#ef5b4d;--red:#c92f3d;--ink:#132238;--muted:#697586;--bg:#f5f7fa;--white:#fff;--line:#e4e8ee;--green:#2f8f5b;--gold:#d39a22}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0d1725;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(100%,560px);min-height:100vh;margin:auto;background:var(--bg);padding-bottom:86px;box-shadow:0 0 70px #0008;position:relative}.top{height:28px;background:#091a2e;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:9px}.header{background:var(--white);border-bottom:4px solid var(--coral);padding:12px 16px;position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:10px}.brand img{width:52px;height:52px;object-fit:contain}.brand h1{margin:0;color:var(--navy);font-size:23px;letter-spacing:2px}.brand p{margin:1px 0 0;color:var(--coral);font-size:7px;font-weight:900;letter-spacing:1.6px}.actions{margin-left:auto;display:flex;gap:7px}.iconbtn{border:1px solid var(--line);background:#fff;width:35px;height:35px;border-radius:50%;display:grid;place-items:center;color:var(--navy);font-size:16px}.page{padding:18px 16px}.hero{background:linear-gradient(140deg,var(--navy),#164b83);color:#fff;border-radius:22px;padding:22px;box-shadow:0 14px 32px #0b2b5230}.eyebrow{font-size:8px;font-weight:900;letter-spacing:1.6px;opacity:.7}.hero h2{font-size:31px;line-height:1.02;letter-spacing:-1.2px;margin:7px 0}.hero h2 span{color:#ffb0a8}.hero p{font-size:11px;line-height:1.55;color:#e8eef6;margin:0}.status{margin-top:15px;background:#ffffff12;border:1px solid #ffffff22;border-radius:12px;padding:9px 10px;display:flex;align-items:center;gap:7px;font-size:9px}.dot{width:8px;height:8px;border-radius:50%;background:#73dc9b;box-shadow:0 0 0 4px #73dc9b22}.section{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.section h3{font-size:15px;margin:0}.section button{border:0;background:none;color:var(--blue);font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{border:1px solid var(--line);background:#fff;border-radius:17px;min-height:116px;padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 4px 12px #00000008}.tile .ico{width:50px;height:50px;border-radius:50%;background:#eaf1f8;display:grid;place-items:center;font-size:24px;margin-bottom:8px}.tile b{font-size:10px}.tile small{font-size:8px;color:var(--muted);margin-top:3px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px}.alert{border-left:4px solid var(--coral)}.alerttop{display:flex;justify-content:space-between;align-items:center}.pill{font-size:8px;font-weight:900;padding:5px 7px;border-radius:99px;background:#fff0ee;color:#b93329}.pill.yellow{background:#fff5d9;color:#7b5a0a}.pill.green{background:#e8f6ee;color:#267144}.card h4{margin:7px 0 4px;font-size:13px}.card p{font-size:10px;color:#6a7380;line-height:1.45;margin:0}.time{font-size:8px;color:#9aa3ae}.notice{background:#fff8df;border:1px solid #f0dfa5;color:#715900;border-radius:13px;padding:11px;font-size:9px;line-height:1.5;margin-top:12px}.toolbar{display:grid;grid-template-columns:1fr 125px;gap:7px}.search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:0 10px;margin-bottom:10px}.search input{border:0;outline:0;width:100%;padding:10px 0;font-size:10px}.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0 8px;font-size:9px}.filters{display:flex;gap:6px;overflow:auto;margin-bottom:11px}.filters button{white-space:nowrap;border:1px solid #dfe3e8;background:#fff;border-radius:99px;padding:7px 10px;font-size:8px;font-weight:900}.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.missing{display:flex;gap:11px}.photo{width:57px;height:70px;background:#e9edf2;border-radius:10px;display:grid;place-items:center;color:#8993a0;font-size:22px;flex:none}.missing .info{flex:1}.map{height:350px;border-radius:19px;overflow:hidden;position:relative;background:#dfe4df;border:1px solid var(--line);background-image:linear-gradient(28deg,transparent 47%,#fff 48%,#fff 51%,transparent 52%),linear-gradient(115deg,transparent 45%,#fff 46%,#fff 49%,transparent 50%),linear-gradient(80deg,transparent 67%,#c6cbc7 68%,#c6cbc7 69%,transparent 70%)}.map:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#9ca59d 1px,transparent 1px);background-size:17px 17px;opacity:.25}.maplabel{position:absolute;background:#fff;border-radius:7px;padding:5px 7px;font-size:8px;font-weight:900;box-shadow:0 3px 8px #0002;z-index:2}.pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 4px 10px #0003;z-index:3}.pin b{transform:rotate(45deg)}.legend{display:flex;gap:13px;padding:10px 2px;font-size:8px;color:#697586}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.red{background:var(--coral)}.yellow{background:var(--gold)}.green{background:var(--green)}.resource{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.resico{width:45px;height:45px;border-radius:13px;background:#eaf1f8;display:grid;place-items:center;font-size:21px;flex:none}.resource strong{font-size:11px}.resource small{display:block;color:#697586;font-size:9px;line-height:1.4;margin-top:3px}.resource span{margin-left:auto;color:#a1a8b0}.emergency{background:#151b23;color:#fff;border-radius:18px;padding:19px}.emergency h2{margin:6px 0;font-size:21px}.emergency p{font-size:10px;color:#b6bec9}.call{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.call a,.primary{display:flex;justify-content:center;align-items:center;border:0;text-decoration:none;background:var(--coral);color:#fff;border-radius:10px;padding:10px;font-size:10px;font-weight:900}.call a.alt{background:#fff;color:#151b23}.tips{display:grid;gap:8px}.tip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}.num{font-size:16px;font-weight:900;color:var(--coral)}.tip p{margin:0;font-size:10px;line-height:1.45}.bottom{position:fixed;bottom:0;width:min(100%,560px);height:78px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:40}.bottom button{border:0;background:#fff;color:#8a929c;font-size:8px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom button.active{color:var(--coral)}.fab{position:fixed;z-index:45;right:max(16px,calc((100% - 560px)/2 + 16px));bottom:91px;border:0;background:var(--navy);color:#fff;border-radius:99px;padding:10px 13px;font-size:9px;font-weight:900;box-shadow:0 7px 20px #0004}.modal{position:fixed;inset:0;background:#0009;z-index:100;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(100%,560px);margin:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:86vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:30px;height:30px}.sheet h2{font-size:19px;margin:0 35px 5px 0}.sheet p{font-size:10px;color:#697586;line-height:1.5}.form{display:grid;gap:9px;margin-top:12px}.form label{font-size:9px;font-weight:900}.form input,.form textarea,.form select{display:block;width:100%;margin-top:4px;border:1px solid #dfe3e8;border-radius:9px;padding:9px;font-size:10px;outline:0}.toast{position:fixed;z-index:120;bottom:90px;left:50%;transform:translateX(-50%);background:#151b23;color:#fff;border-radius:10px;padding:9px 12px;font-size:9px;white-space:nowrap}.empty{text-align:center;padding:30px;color:#7b8490;font-size:10px}@media(min-width:700px){body{padding:25px 0}.app{border-radius:28px;overflow:hidden}.bottom{position:absolute}.fab{position:absolute}.header{position:sticky}}
</style>
</head>
<body>
<div class="app">
<div class="top"><span>9:41</span><span>● ● ▰</span></div>
<header class="header"><div class="brand">
<img src="scelus-logo.png" alt="Scelus logo" onerror="this.style.display='none'">
<div><h1>SCELUS</h1><p>SAFE TODAY. SECURE TOMORROW.</p></div>
<div class="actions"><button class="iconbtn" onclick="toast('You are up to date.')">♢</button><button class="iconbtn" onclick="openModal('About Scelus')">?</button></div>
</div></header>
<main id="main"></main>
<nav class="bottom">
<button data-p="home" onclick="go('home')">⌂<span>HOME</span></button>
<button data-p="alerts" onclick="go('alerts')">⚠<span>ALERTS</span></button>
<button data-p="missing" onclick="go('missing')">⌕<span>MISSING</span></button>
<button data-p="resources" onclick="go('resources')">♡<span>RESOURCES</span></button>
</nav>
<button class="fab" onclick="report()">＋ REPORT</button>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="sheet"></div></div></div>
<div id="toast" class="toast" style="display:none"></div>
</div>
<script>
const alerts=[
{title:"Vehicle break-in reported",cat:"Safety",loc:"Delmar Blvd • University City",ago:"12 min ago",desc:"Sample community report for the portfolio demo.",sev:"moderate"},
{title:"Road closure",cat:"Traffic",loc:"Skinker Blvd • St. Louis",ago:"1 hr ago",desc:"Sample traffic notice used for demonstration.",sev:"low"},
{title:"Community safety notice",cat:"Safety",loc:"Forest Park • St. Louis",ago:"2 hrs ago",desc:"Sample safety notice. Demo data is not an official report.",sev:"low"},
{title:"Community search requested",cat:"Missing Person",loc:"University City",ago:"Yesterday",desc:"Sample missing-person workflow record.",sev:"moderate"}];
const missing=[
{name:"Jordan M.",age:19,loc:"Near Delmar Loop",date:"Sept. 3",desc:"Demo record for the prototype. Do not treat as an active real-world notice."},
{name:"Avery R.",age:22,loc:"Near Forest Park",date:"Sept. 2",desc:"Demo record for the prototype."},
{name:"Marcus T.",age:17,loc:"Near Clayton",date:"Sept. 1",desc:"Demo record for the prototype."}];

function nav(p){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.p===p))}
function go(p){nav(p);window.scrollTo(0,0);document.getElementById('main').innerHTML={home:home,alerts:alertsPage,missing:missingPage,resources:resourcesPage,map:mapPage,emergency:emergencyPage,crisis:crisisPage,tips:tipsPage}[p]()}
function home(){return `<div class="page">
<section class="hero"><div class="eyebrow">COMMUNITY SAFETY PLATFORM</div><h2>Stay aware.<br><span>Look out for each other.</span></h2><p>Scelus brings community safety information, missing-person notices, and support resources into one place.</p><div class="status"><i class="dot"></i> Community monitoring is active</div></section>
<div class="section"><h3>Quick actions</h3><button onclick="report()">＋ Report an incident</button></div>
<div class="grid">
${tile("🚨","Emergency","Get help","emergency")} ${tile("⚠️","Safety alerts","Nearby reports","alerts")} ${tile("🔎","Missing persons","Notices","missing")}
${tile("🧠","Crisis support","Get support","crisis")} ${tile("🗺️","Safety map","View activity","map")} ${tile("🛡️","Safety tips","Be prepared","tips")}
</div>
<div class="section"><h3>Latest alerts</h3><button onclick="go('alerts')">VIEW ALL ›</button></div>
${alerts.slice(0,3).map(alertCard).join("")}
<div class="section"><h3>Need support?</h3></div>
${resource("🧠","Crisis support","Mental health and emotional support.","crisis")}
${resource("🤝","Community resources","Trusted organizations and services.","resources")}
<div class="notice"><b>Demo mode:</b> Safety and missing-person records shown here are sample data for a portfolio demonstration, not official reports.</div>
</div>`}
function tile(i,t,s,p){return `<button class="tile" onclick="go('${p}')"><span class="ico">${i}</span><b>${t}</b><small>${s}</small></button>`}
function alertCard(a){return `<article class="card alert"><div class="alerttop"><span class="pill ${a.sev==='low'?'green':'yellow'}">${a.cat}</span><span class="time">${a.ago}</span></div><h4>${a.title}</h4><p>📍 ${a.loc}</p><p style="margin-top:5px">${a.desc}</p></article>`}
function pageTitle(t,s){return `<div class="page"><div class="eyebrow" style="color:var(--coral)">SCELUS</div><h2 style="font-size:27px;margin:4px 0">${t}</h2><p style="font-size:10px;color:var(--muted);margin:0 0 15px">${s}</p>`}
function alertsPage(){return pageTitle("Safety alerts","Recent community reports and safety notices.")+`<div class="toolbar"><div class="search">⌕<input id="aq" oninput="filterAlerts()" placeholder="Search alerts…"></div><select class="select" id="city"><option>All areas</option><option>St. Louis</option><option>University City</option></select></div><div class="filters">${["All","Safety","Traffic","Missing Person"].map(x=>`<button onclick="setFilter(this,'${x}')">${x}</button>`).join("")}</div><div id="alist">${alerts.map(alertCard).join("")}</div><div class="notice"><b>Information safety:</b> This prototype separates demo records from verified public-safety data. A production system should connect only authorized sources.</div></div>`}
let currentFilter="All";function setFilter(btn,f){currentFilter=f;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));btn.classList.add('on');filterAlerts()}function filterAlerts(){let q=(document.getElementById('aq')?.value||'').toLowerCase();let x=alerts.filter(a=>(currentFilter==="All"||a.cat===currentFilter)&&(`${a.title} ${a.loc}`.toLowerCase().includes(q)));document.getElementById('alist').innerHTML=x.length?x.map(alertCard).join(""):`<div class="empty">No matching alerts.</div>`}
function missingPage(){return pageTitle("Missing persons","Review notices and share only verified information.")+`<div class="search">⌕<input id="mq" oninput="filterMissing()" placeholder="Search name or location…"></div><div id="mlist">${missing.map(missingCard).join("")}</div><div class="notice"><b>Important:</b> Do not approach someone you believe may be in danger. Contact appropriate authorities with verified information.</div></div>`}
function missingCard(m){return `<article class="card missing"><div class="photo">?</div><div class="info"><div class="alerttop"><span class="pill yellow">ACTIVE</span><span class="time">${m.date}</span></div><h4>${m.name}, ${m.age}</h4><p>📍 ${m.loc}</p><p>${m.desc}</p><button class="primary" style="margin-top:8px" onclick="toast('Tip flow opened — demo only')">Submit a tip</button></div></article>`}
function filterMissing(){let q=document.getElementById('mq').value.toLowerCase();document.getElementById('mlist').innerHTML=missing.filter(m=>`${m.name} ${m.loc}`.toLowerCase().includes(q)).map(missingCard).join("")||`<div class="empty">No matching records.</div>`}
function mapPage(){return pageTitle("Safety map","Illustrative map of demo community activity.")+`<div class="map"><span class="maplabel" style="left:9%;top:10%">University City</span><span class="maplabel" style="right:8%;top:45%">Forest Park</span><span class="maplabel" style="left:34%;bottom:12%">Delmar Loop</span><span class="pin" style="left:25%;top:44%;background:var(--coral)"><b>!</b></span><span class="pin" style="left:65%;top:25%;background:var(--gold)"><b>!</b></span><span class="pin" style="left:70%;top:67%;background:var(--green)"><b>✓</b></span></div><div class="legend"><span><i class="red"/>Safety</span><span><i class="yellow"/>Moderate</span><span><i class="green"/>Low</span></div><div class="notice"><b>Location privacy:</b> The demo does not request your precise location.</div></div>`}
function resourcesPage(){return pageTitle("Community resources","Support for emergencies, mental health, and well-being.")+resource("🧠","988 Suicide & Crisis Lifeline","Call or text 988 for crisis support.","https://988lifeline.org/")+resource("🚨","911 Emergency Services","For immediate danger or emergencies.","tel:911")+resource("🤝","National Domestic Violence Hotline","24/7 support and safety planning.","https://www.thehotline.org/")+resource("🛡️","RAINN","Support and resources for survivors.","https://rainn.org/")+`<div class="notice"><b>Production note:</b> Local resources should be verified before public launch.</div></div>`}
function resource(i,t,d,p){return `<a class="card resource" href="${p}" target="${p.startsWith('http')?'_blank':''}" rel="noreferrer"><span class="resico">${i}</span><div><strong>${t}</strong><small>${d}</small></div><span>›</span></a>`}
function emergencyPage(){return pageTitle("Emergency help","Scelus cannot dispatch emergency responders.")+`<div class="emergency"><div style="font-size:26px">🚨</div><h2>Need immediate help?</h2><p>If you are in immediate danger, contact emergency services now.</p><div class="call"><a href="tel:911">CALL 911</a><a class="alt" href="tel:988">CALL 988</a></div></div><div class="card"><h4>Trusted contacts</h4><p>Add people you trust in a production version so they can be reached quickly.</p></div></div>`}
function crisisPage(){return pageTitle("Crisis support","You do not have to handle a crisis alone.")+resource("🧠","988 Suicide & Crisis Lifeline","Call or text 988 for free, confidential crisis support.","tel:988")+resource("🤝","Reach someone you trust","Contact a friend, family member, counselor, or trusted support person.","resources")+`<div class="notice"><b>If you are in immediate danger:</b> call 911 or go to the nearest emergency department.</div></div>`}
function tipsPage(){let t=["Keep your phone charged when traveling alone.","Share your route with someone you trust.","Stay aware of your surroundings and avoid distractions.","Keep valuables out of sight in vehicles.","Trust your instincts and move toward a populated, well-lit area if something feels wrong."];return pageTitle("Safety tips","Practical habits for everyday safety.")+'<div class="tips">'+t.map((x,i)=>`<div class="tip"><span class="num">0${i+1}</span><p>${x}</p></div>`).join("")+'</div></div>'}
function report(){openModal("Report a community safety issue",`<p>Reports are submitted for review before appearing publicly.</p><div class="form"><label>Title<input id="rt" placeholder="What happened?"></label><label>Category<select id="rc"><option>Safety</option><option>Traffic</option><option>Missing Person</option></select></label><label>Location<input id="rl" placeholder="Street or general area"></label><label>Description<textarea id="rd" rows="4" placeholder="Share the relevant details."></textarea></label><button class="primary" onclick="submitDemo()">Submit report</button></div>`)}
function submitDemo(){closeModal();toast("Demo report submitted for review ✓")}
function openModal(title,body){document.getElementById('sheet').innerHTML=`<h2>${title}</h2>${body||`<p>Scelus is a community safety concept originally developed during the Girls Who Code Leadership Academy. This portfolio demo shows the product direction and interaction design.</p><div class="notice"><b>Safe Today. Secure Tomorrow.</b><br>Demo data is not official public-safety data.</div>`}`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)}
go('home');
</script>
</body>
</html>
